name: Go Lint

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label"
        type: string
        default: "ubuntu-latest"
      submodules:
        description: "Fetch git submodules recursively"
        type: boolean
        default: false
      miru:
        description: "Command that runs the miru CLI"
        type: string
        default: "go tool miru"
    secrets:
      SUBMODULES_TOKEN:
        description: "Read access to private mirurobotics Go modules"
        required: false

jobs:
  go-lint:
    timeout-minutes: 10
    name: go-lint
    runs-on: ${{ inputs.runs-on }}
    env:
      HAS_SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules && 'recursive' }}

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ./go.mod

      - name: Cache golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: golangci-lint-${{ runner.os }}-

      - name: Configure Git for Go Modules
        if: env.HAS_SUBMODULES_TOKEN == 'true'
        env:
          SUBMODULES_TOKEN: ${{ secrets.SUBMODULES_TOKEN }}
        run: |
          url="https://${SUBMODULES_TOKEN}@github.com/mirurobotics/"
          git config --global url."$url".insteadOf \
            "https://github.com/mirurobotics/"
          go env -w GOPRIVATE="github.com/mirurobotics/*"

      - name: Run Linters
        env:
          MIRU: ${{ inputs.miru }}
        run: |
          # shellcheck disable=SC2086
          $MIRU lint --fix=false
