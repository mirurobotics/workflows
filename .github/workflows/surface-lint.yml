name: Surface Lint

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label"
        type: string
        default: "ubuntu-latest"
      shell-ignore:
        description: "Space-separated paths to exclude from shell script linting"
        type: string
        default: ""

jobs:
  surface-lint:
    timeout-minutes: 10
    name: surface-lint
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # yamllint disable rule:line-length
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          file_or_dir: .
          config_file: .yamllint.yml

      - name: Install shellcheck and shfmt
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          SHFMT_VERSION: v3.12.0
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/bin" --strip-components=1 "shellcheck-$SHELLCHECK_VERSION/shellcheck"
          GOBIN="$RUNNER_TEMP/bin" go install "mvdan.cc/sh/v3/cmd/shfmt@$SHFMT_VERSION"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Find Shell Scripts
        env:
          SHELL_IGNORE: ${{ inputs.shell-ignore }}
        run: |
          read -ra ignored <<< "$SHELL_IGNORE"
          shfmt -f . > "$RUNNER_TEMP/all-shell-scripts"
          while IFS= read -r script; do
            for path in "${ignored[@]}"; do
              path=${path#./}
              path=${path%/}
              case "$script" in "$path" | "$path"/*) continue 2 ;; esac
            done
            echo "$script"
          done < "$RUNNER_TEMP/all-shell-scripts" > "$RUNNER_TEMP/shell-scripts"

      - name: Lint Shell Scripts
        run: xargs -r -d '\n' shellcheck < "$RUNNER_TEMP/shell-scripts"

      - name: Lint Shell Script Formatting
        run: xargs -r -d '\n' shfmt -d -i 4 -ci < "$RUNNER_TEMP/shell-scripts" || { echo "fix: shfmt -w -i 4 -ci <file>"; exit 1; }

      - name: Lint Shell Script Size
        run: |
          limit=100
          status=0
          while IFS= read -r script; do
            grep -q '^#[[:space:]]*nolint:filelen' "$script" && continue
            lines=$(awk '!/^[[:space:]]*(#|$)/ { n++ } END { print n + 0 }' "$script")
            if [ "$lines" -gt "$limit" ]; then
              echo "$script: file is $lines lines (limit $limit); port it to Go or Python"
              status=1
            fi
          done < "$RUNNER_TEMP/shell-scripts"
          exit "$status"

      - name: Lint GitHub Actions Workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
