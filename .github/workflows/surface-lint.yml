name: Surface Lint

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label"
        type: string
        default: "ubuntu-latest"
      shellcheck-ignore:
        description: "Space-separated paths to exclude from shell script linting"
        type: string
        default: ""
      max-pr-description-chars:
        description: "Max characters in a PR description (0 disables)"
        type: number
        default: 1000
      max-plan-chars:
        description: "Max characters in a new plan (0 disables)"
        type: number
        default: 5000

jobs:
  surface-lint:
    timeout-minutes: 10
    name: surface-lint
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # yamllint disable rule:line-length
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          file_or_dir: .
          config_file: .yamllint.yml

      - name: Lint Shell Scripts
        # yamllint disable rule:line-length
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts
          ignore_paths: ${{ inputs.shellcheck-ignore }}

      - name: Lint GitHub Actions Workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      # Only plans new to the repo are checked: a file git doesn't pair with a
      # base plan as a rename. Older long plans can still be moved and closed.
      # The sections filled in during implementation don't count.
      - name: Check Plan Length
        if: inputs.max-plan-chars > 0 && (github.event_name == 'pull_request' || github.event_name == 'merge_group')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          MAX_CHARS: ${{ inputs.max-plan-chars }}
          LC_ALL: C.UTF-8
        run: |
          git fetch --depth=1 --no-tags origin "$BASE_SHA"
          set -o pipefail
          plans=$(git -c core.quotePath=false diff --name-only --diff-filter=A "$BASE_SHA" HEAD -- 'plans/backlog/*.md' 'plans/active/*.md' 'plans/completed/*.md')
          status=0
          while IFS= read -r plan; do
            [ -n "$plan" ] || continue
            chars=$(awk '/^```/{fence=!fence} !fence && /^## /{skip=($0 ~ /^## (Progress|Surprises & Discoveries|Decision Log|Outcomes & Retrospective)[[:space:]]*$/)} !skip' "$plan" | wc -m)
            if [ "$chars" -gt "$MAX_CHARS" ]; then
              echo "::error file=$plan::Plan is $chars characters, not counting Progress, Surprises & Discoveries, Decision Log and Outcomes & Retrospective; the limit is $MAX_CHARS."
              status=1
            fi
          done <<< "$plans"
          exit "$status"

  # Private repos must grant `pull-requests: read` for re-runs to see edits.
  pr-description:
    timeout-minutes: 5
    name: pr-description
    if: inputs.max-pr-description-chars > 0 && github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout Check Script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: pr-description-src
          sparse-checkout: pr-description
          persist-credentials: false

      - name: Check PR Description Length
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MAX_CHARS: ${{ inputs.max-pr-description-chars }}
        with:
          script: |
            const lib = `${process.env.GITHUB_WORKSPACE}/pr-description-src/pr-description`
            await require(`${lib}/check.js`).check({ github, context, core, limit: Number(process.env.MAX_CHARS) })
