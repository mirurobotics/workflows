name: Surface Lint

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner label"
        type: string
        default: "ubuntu-latest"
      shellcheck-ignore:
        description: "Space-separated paths to exclude from shell script linting"
        type: string
        default: ""
      max-pr-description-chars:
        description: "Max characters in a pull request description (0 disables)"
        type: number
        default: 1000

jobs:
  surface-lint:
    timeout-minutes: 10
    name: surface-lint
    runs-on: ${{ inputs.runs-on }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # yamllint disable rule:line-length
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          file_or_dir: .
          config_file: .yamllint.yml

      - name: Lint Shell Scripts
        # yamllint disable rule:line-length
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts
          ignore_paths: ${{ inputs.shellcheck-ignore }}

      - name: Lint GitHub Actions Workflows
        uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

      # Boilerplate (HTML comments, bot footers, the attribution line) and the
      # Decisions and Reviewer notes sections don't count toward the limit.
      # Bot PRs and Mikado reference PRs are skipped. The body is fetched live,
      # so re-running the job after editing the description re-checks it.
      - name: Check PR Description Length
        if: inputs.max-pr-description-chars > 0 && github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
          EVENT_BODY: ${{ github.event.pull_request.body }}
          MAX_CHARS: ${{ inputs.max-pr-description-chars }}
        shell: python3 {0}
        run: |
          import json, os, re, sys, urllib.request

          body = os.environ["EVENT_BODY"]
          try:
              req = urllib.request.Request(os.environ["PR_URL"], headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
              })
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = json.load(resp).get("body") or ""
          except Exception as err:
              print(f"Using the description from the triggering event ({err}).")

          body = body.replace("\r\n", "\n")
          body = re.sub(r"<!--\s*([\w-]+):footer\s*-->.*?<!--\s*/\1:footer\s*-->", "", body, flags=re.S)
          body = re.sub(r"<!--.*?-->", "", body, flags=re.S)
          boilerplate = re.compile(
              r"_Requested by \*\*|🤖 Generated with|_Generated by \[Claude Code\]|https://claude\.ai/code/\S+$|---$"
          )
          kept, skip = [], False
          for line in body.split("\n"):
              if line.startswith("## "):
                  skip = line[3:].strip().lower() in ("decisions", "reviewer notes")
              if not skip and not boilerplate.match(line.strip()):
                  kept.append(line)
          text = "\n".join(kept).strip()
          if text.startswith("> **Reference PR"):
              print("Mikado reference PR, skipping.")
              sys.exit(0)
          chars = len(text)
          limit = int(os.environ["MAX_CHARS"])
          print(f"PR description is {chars} characters; the limit is {limit}.")
          if chars > limit:
              print(f"::error::PR description is {chars} characters, not counting boilerplate, Decisions or Reviewer notes; the limit is {limit}. Shorten it, then re-run this job.")
              sys.exit(1)
