name: PR Description

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]
  # Lets the check be required: the job skips (passes) in the merge queue.
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-description:
    uses: ./.github/workflows/pr-description.yml
