name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest # standard GitHub-hosted runners are free in public repos
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the AI review scripts
        run: node --test ai-review/lib/*.test.js

      - name: Test the PR description check
        run: node --test pr-description/*.test.js

  surface-lint:
    uses: ./.github/workflows/surface-lint.yml
    with:
      max-pr-description-chars: 0 # pr-description.yml checks it, on edits too
