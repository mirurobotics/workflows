# Required AI review of every non-draft PR, and an advisory design review
# of drafts. Posts the `ai-review` status checked by branch protection.
# See the reusable workflow for details.
#
# pull_request_target runs this file, and the local reusable workflow it
# calls, from the base branch, so a PR cannot edit or delete its own
# review.

name: AI Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  ai-review:
    uses: ./.github/workflows/ai-review.yml
    with:
      runs-on: ubuntu-latest # standard GitHub-hosted runners are free in public repos
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
